<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Christmas Tree</title>
    <style>
      html, body { margin: 0; height: 100%; background: rgb(8, 10, 20); overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; width: 100vw; height: 100vh; isolation: isolate; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #glow { mix-blend-mode: plus-lighter; pointer-events: none; }
      #glow.off { display: none; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
        align-items: center; justify-content: center; cursor: pointer;
        background: rgba(8, 10, 20, 0.72); color: rgb(250, 196, 70);
        font: 15px Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace;
      }
      #overlay small { color: rgb(90, 96, 114); }
      #overlay.hidden { display: none; }
      #vol {
        position: fixed; right: 14px; bottom: 12px; z-index: 5; display: flex; align-items: center; gap: 8px;
        font: 12px Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace; color: rgb(90, 96, 114);
        opacity: 0.55; transition: opacity 0.2s;
      }
      #vol:hover, #vol:focus-within { opacity: 1; }
      #vol-icon { cursor: pointer; color: rgb(250, 196, 70); font-size: 14px; user-select: none; }
      #vol-label { min-width: 34px; text-align: right; }
      #vol input { width: 110px; accent-color: rgb(250, 196, 70); }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="screen"></canvas><canvas id="glow"></canvas></div>
    <div id="vol"><span id="vol-icon" title="mute (M)">♪</span><input id="vol-slider" type="range" min="0" max="100" step="1" aria-label="volume" /><span id="vol-label">70%</span></div>
    <div id="overlay"><span id="overlay-title">loading scene…</span><small id="overlay-sub"></small></div>
    <audio id="music" src="music.mp3" loop preload="auto"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
